services:
  rpanion-server:
    image: rpanion:0.12.0
    platform: linux/arm64
    ports:
      - "3001:3001"
    working_dir: /usr/share/rpanion-server/app
    volumes:
      - ./:/usr/share/rpanion-server/app
      - rpanion_node_modules:/usr/share/rpanion-server/app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: >
      bash -lc "npm install && npm run dev"
    restart: unless-stopped

volumes:
  rpanion_node_modules:
